<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abubakar Ai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 600px; padding: 25px; border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .hidden { display: none !important; }
        input[type="password"], textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #0369a1; }
        #chat-box { height: 300px; overflow-y: auto; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; line-height: 1.4; }
        .user-msg { background: #0369a1; text-align: right; }
        .ai-msg { background: #334155; text-align: left; color: #38bdf8; }
        .error { color: #f87171; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="auth-screen" class="card">
        <h2>🔒 Abubakar Ai Access</h2>
        <input type="password" id="pass-input" placeholder="Enter Access Password...">
        <button onclick="checkPassword()">Unlock Workspace</button>
        <p id="auth-error" class="error hidden">Incorrect Password! Access Denied.</p>
    </div>

    <!-- Main Workspace -->
    <div id="app-screen" class="card hidden">
        <h2>🚀 Abubakar Ai Workspace</h2>
        <div id="chat-box"></div>
        <textarea id="prompt-input" rows="3" placeholder="Ask Abubakar Ai anything..."></textarea>
        <button onclick="sendPrompt()">Send Prompt</button>
    </div>

    <script>
        const AUTH_KEY = "1234567890";

        function checkPassword() {
            const input = document.getElementById("pass-input").value;
            if (input === AUTH_KEY) {
                document.getElementById("auth-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
            } else {
                document.getElementById("auth-error").classList.remove("hidden");
            }
        }

        async function sendPrompt() {
            const input = document.getElementById("prompt-input");
            const box = document.getElementById("chat-box");
            const text = input.value.trim();
            if (!text) return;

            box.innerHTML += `<div class="msg user-msg"><b>You:</b> ${text}</div>`;
            input.value = "";
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                box.innerHTML += `<div class="msg ai-msg"><b>Abubakar Ai:</b> ${data.response}</div>`;
            } catch (err) {
                box.innerHTML += `<div class="msg ai-msg" style="color:#f87171;"><b>Error:</b> Could not connect to AI backend.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
